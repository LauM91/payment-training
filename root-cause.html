<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Root Cause Analysis Training</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .transition-all { transition: all 0.3s ease; }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState } = React;

    const RootCauseAnalysisTraining = () => {
      const [activeScenario, setActiveScenario] = useState(null);
      const [showInstructions, setShowInstructions] = useState(true);
      const [activeTemplateStep, setActiveTemplateStep] = useState(null);
      const [showAdditionalInfo, setShowAdditionalInfo] = useState(false);
      const [showKeyQuestions, setShowKeyQuestions] = useState(false);
      const [showAnswer, setShowAnswer] = useState(false);

      const categories = {
        hardware: { color: 'bg-red-100 text-red-700 border-red-300', label: 'Hardware' },
        power: { color: 'bg-yellow-100 text-yellow-700 border-yellow-300', label: 'Power Source' },
        network: { color: 'bg-blue-100 text-blue-700 border-blue-300', label: 'Network' },
        config: { color: 'bg-purple-100 text-purple-700 border-purple-300', label: 'Configuration' },
        software: { color: 'bg-green-100 text-green-700 border-green-300', label: 'Software' },
        agreement: { color: 'bg-orange-100 text-orange-700 border-orange-300', label: 'Agreement/KYC' },
        integration: { color: 'bg-pink-100 text-pink-700 border-pink-300', label: 'Integration' }
      };

      const templateSteps = [
        {
          id: 'gather',
          title: 'GATHER',
          subtitle: 'Collect Information',
          color: 'bg-blue-500 hover:bg-blue-600',
          activeColor: 'bg-blue-600 ring-4 ring-blue-300',
          questions: [
            "What exactly is happening? (Describe the symptom)",
            "When did it start? What was the last time it worked correctly?",
            "Did anything change recently? (Updates, moves, new equipment)",
            "Is it affecting all transactions or only specific types?",
            "What terminal model is it? (Countertop, portable, PIN pad?)"
          ]
        },
        {
          id: 'isolate',
          title: 'ISOLATE',
          subtitle: 'Narrow Down the Problem',
          color: 'bg-yellow-500 hover:bg-yellow-600',
          activeColor: 'bg-yellow-600 ring-4 ring-yellow-300',
          questions: [
            "Does the issue occur all the time or intermittently?",
            "Have you tried restarting the terminal?",
            "Are other functions working? (Display, printer, card readers)",
            "Is the issue with one terminal or multiple?",
            "Are other merchants reporting similar issues?"
          ]
        },
        {
          id: 'identify',
          title: 'IDENTIFY',
          subtitle: 'Determine the Category',
          color: 'bg-green-500 hover:bg-green-600',
          activeColor: 'bg-green-600 ring-4 ring-green-300',
          questions: [
            "HARDWARE: Are there physical signs of damage?",
            "POWER: Are there any lights on? Did power get interrupted?",
            "NETWORK: Is the terminal showing connected?",
            "CONFIGURATION: Is it a new/replacement terminal?",
            "SOFTWARE: Is the date/time correct? Any error codes?",
            "AGREEMENT: Are there pending KYC requests?",
            "INTEGRATION: Is this connected to a POS? Did software change?"
          ]
        },
        {
          id: 'verify',
          title: 'VERIFY',
          subtitle: 'Confirm Your Hypothesis',
          color: 'bg-purple-500 hover:bg-purple-600',
          activeColor: 'bg-purple-600 ring-4 ring-purple-300',
          questions: [
            "Does my suspected cause explain ALL the symptoms?",
            "If I'm right, what should happen when we apply the fix?",
            "Are there other possible causes I should rule out?",
            "Do I have enough information to proceed?"
          ]
        },
        {
          id: 'resolve',
          title: 'RESOLVE',
          subtitle: 'Apply Solution & Confirm',
          color: 'bg-pink-500 hover:bg-pink-600',
          activeColor: 'bg-pink-600 ring-4 ring-pink-300',
          questions: [
            "What is the fix? Can the merchant do it themselves?",
            "If not, what needs to be escalated and to whom?",
            "How will we confirm the issue is resolved?",
            "What should the merchant do if the issue returns?"
          ]
        }
      ];

      const scenarios = [
        {
          id: 1,
          title: "The Blank Screen Mystery",
          category: "power",
          merchantSays: "My terminal screen is completely black. I tried pressing buttons but nothing happens. It was working fine yesterday when we closed the shop.",
          additionalInfo: [
            "Terminal model: Verifone VX 520 (countertop)",
            "The merchant moved the terminal to a different counter last night to clean",
            "There are no lights on the terminal at all",
            "Other devices on the same counter are working (computer, lamp)"
          ],
          keyQuestions: [
            "Is the power cable firmly connected to both the terminal and the wall outlet?",
            "Was the power cable disconnected when moving the terminal?",
            "Is the power adapter showing any indicator lights?",
            "Have you tried a different power outlet?"
          ],
          rootCause: "Power Source - Disconnected or loose power cable",
          explanation: "When the merchant moved the terminal to clean, the power cable was likely disconnected or came loose. The VX 520 is a countertop terminal that requires constant power. No lights on the terminal indicates no power is reaching the device. Since other devices work on the same counter, the outlet is fine - the issue is the connection between the power adapter and the terminal.",
          resolution: "Ask the merchant to check that the power cable is firmly connected at both ends (terminal and wall). If using a power adapter, ensure it's properly connected. The terminal should power on automatically once power is restored."
        },
        {
          id: 2,
          title: "The Unresponsive Card Reader",
          category: "hardware",
          merchantSays: "Customers can tap their cards and it works, but when they try to insert chip cards, the terminal doesn't read them at all. No error message, it just doesn't recognize the card is there.",
          additionalInfo: [
            "Terminal model: Verifone P400 PIN Pad",
            "Contactless (tap) payments work perfectly",
            "Magnetic swipe also works",
            "The issue started about a week ago",
            "The merchant mentions they had a very busy period recently"
          ],
          keyQuestions: [
            "Does the terminal display any prompt when a chip card is inserted?",
            "Have you tried different chip cards from different banks?",
            "Is there anything visible inside the chip card slot (debris, damage)?",
            "Has the terminal been dropped or physically damaged recently?"
          ],
          rootCause: "Hardware - Chip card reader malfunction or contamination",
          explanation: "The fact that contactless and magnetic stripe work but chip doesn't indicates an isolated issue with the EMV chip reader component. After a busy period with many card insertions, the chip reader contacts can become dirty or worn. Since there's no error message, the reader isn't detecting the card at all, suggesting a hardware issue.",
          resolution: "First, recommend using a chip reader cleaning card to clean the contacts. If that doesn't work, the chip reader component may be damaged and the terminal will need to be replaced or sent for service. In the meantime, the merchant can continue accepting contactless and swipe payments."
        },
        {
          id: 3,
          title: "The Connection That Keeps Dropping",
          category: "network",
          merchantSays: "The terminal connects in the morning but then loses connection randomly throughout the day. Sometimes it reconnects by itself, sometimes we have to restart it. It's very frustrating because we lose sales.",
          additionalInfo: [
            "Terminal model: Verifone T650p (portable, wireless)",
            "Terminal uses Wi-Fi connection",
            "The merchant's shop has thick concrete walls",
            "The Wi-Fi router is located in the back office",
            "The merchant recently added a microwave and wireless speakers"
          ],
          keyQuestions: [
            "Does the connection drop more frequently in certain areas of the shop?",
            "What is the Wi-Fi signal strength showing on the terminal?",
            "Have you added any new electronic equipment recently?",
            "How far is the terminal from the Wi-Fi router when it disconnects?"
          ],
          rootCause: "Network - Wi-Fi signal interference and weak coverage",
          explanation: "Multiple factors point to Wi-Fi issues: thick concrete walls reduce signal strength, the router being far from where the terminal is used, and new equipment (especially microwaves) can cause interference on the 2.4GHz band. The T650p is portable and gets moved around, so when it's far from the router or near interfering equipment, it loses connection.",
          resolution: "Recommend: 1) Keep the terminal closer to the router when possible, 2) Consider adding a Wi-Fi range extender, 3) Check if the terminal can connect to 5GHz band (less interference), 4) Keep the terminal away from microwaves during transactions. If issues persist, consider a terminal with SIM card connectivity."
        },
        {
          id: 4,
          title: "The Wrong Business Name",
          category: "config",
          merchantSays: "We just received our new terminal and set it up, but the receipts are printing with our old business name. We changed our company name three months ago. Also, the address on the receipt is our old location.",
          additionalInfo: [
            "The merchant rebranded and moved locations 3 months ago",
            "They received a replacement terminal for a damaged one",
            "The old terminal had the correct new business name",
            "The terminal is processing transactions normally",
            "The merchant ID and terminal ID appear to be correct"
          ],
          keyQuestions: [
            "Is this a brand new terminal or a replacement?",
            "Were the business details updated with the payment provider after the rebrand?",
            "Did your previous terminal show the correct business name?",
            "Have you received confirmation that the new details were saved?"
          ],
          rootCause: "Configuration - Terminal loaded with outdated merchant parameters",
          explanation: "When a replacement terminal is set up, it downloads the merchant configuration (parameters) from the central system. If the central database wasn't updated with the new business name and address, or if the terminal was configured with an older parameter file, it will show outdated information.",
          resolution: "The merchant parameters need to be updated and re-downloaded to the terminal. This typically requires the support team to update the merchant profile in the back-end system, then trigger a parameter download. The merchant may need to perform a 'parameter download' from the terminal menu."
        },
        {
          id: 5,
          title: "The Declined Transactions Mystery",
          category: "software",
          merchantSays: "Since this morning, all card transactions are being declined. Every single card - Visa, Mastercard, even debit cards. The terminal shows 'Declined' but no other error message. We haven't changed anything.",
          additionalInfo: [
            "The terminal was working fine until closing time yesterday",
            "The terminal shows it's connected to the network",
            "Multiple different cards from different customers all decline",
            "The terminal date shows '01/01/2020' (incorrect)",
            "The battery was completely drained overnight (portable terminal)"
          ],
          keyQuestions: [
            "What date and time is showing on the terminal?",
            "Did the terminal lose power or was the battery fully drained?",
            "Are there any error messages in the terminal logs?",
            "When was the last successful transaction?"
          ],
          rootCause: "Software - Incorrect system date/time causing security validation failures",
          explanation: "When a terminal's battery completely drains, it can lose its date/time settings and reset to a default date (like 01/01/2020). Payment transactions are validated against timestamps - if the terminal date is years in the past, the security certificates appear invalid to the payment processor, causing all transactions to be declined.",
          resolution: "The terminal's date and time need to be corrected. This may be done manually in the settings menu or by performing a parameter download which usually syncs the time. For portable terminals, ensure they are charged regularly to prevent complete battery drain."
        },
        {
          id: 6,
          title: "The Urgent KYC Warning",
          category: "agreement",
          merchantSays: "We received an email saying our payment services will be terminated in 14 days if we don't complete some KYC form. Is this real or a scam? We've been a customer for 5 years and never had issues.",
          additionalInfo: [
            "The email came from kyc@swedbankpay.com",
            "The merchant hasn't updated their business information in 3 years",
            "They recently added a new business partner/owner",
            "The merchant is worried about sharing sensitive business information",
            "Other merchants they know have received similar emails"
          ],
          keyQuestions: [
            "What email address did the message come from exactly?",
            "Have there been any changes to your business structure or ownership?",
            "When did you last update your business information with us?",
            "Have you logged into the merchant portal to check for pending requests?"
          ],
          rootCause: "Agreement - Required KYC (Know Your Customer) update not completed",
          explanation: "This is legitimate, not a scam. Payment providers are legally required to maintain up-to-date information about their merchants (KYC) to comply with anti-money laundering regulations. KYC reviews are triggered periodically or when changes are detected (like a new business partner). If the merchant doesn't respond, services must be suspended by law.",
          resolution: "Reassure the merchant this is legitimate and normal. Direct them to complete the KYC form digitally through the merchant portal or via the email link. Explain this is required by law to prevent financial crime. Emphasize the deadline and consequences of not responding."
        }
      ];

      const categoryOrder = ['hardware', 'power', 'network', 'config', 'software', 'agreement'];

      const handleScenarioClick = (scenario) => {
        if (activeScenario?.id === scenario.id) {
          setActiveScenario(null);
        } else {
          setActiveScenario(scenario);
          setShowAdditionalInfo(false);
          setShowKeyQuestions(false);
          setShowAnswer(false);
        }
      };

      return (
        <div className="min-h-screen bg-gray-100 p-4">
          <div className="max-w-6xl mx-auto">
            
            {/* Header */}
            <div className="bg-white rounded-xl shadow-lg p-6 mb-6">
              <h1 className="text-2xl font-bold text-gray-800 mb-2">Root Cause Analysis Training</h1>
              <p className="text-gray-600 mb-4">Practice identifying the root cause of terminal issues. Analyze each scenario step by step.</p>
              
              {/* Category Legend */}
              <div className="flex flex-wrap gap-2">
                <span className="text-sm text-gray-500 mr-2">Categories:</span>
                {categoryOrder.map(key => (
                  <span key={key} className={`text-xs px-2 py-1 rounded-full border ${categories[key].color}`}>
                    {categories[key].label}
                  </span>
                ))}
              </div>
            </div>

            {/* Instructions Section */}
            <div className="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-xl shadow-lg p-5 mb-6 text-white">
              <div className="flex justify-between items-center">
                <h2 className="text-lg font-bold flex items-center gap-2">
                  📖 How to Use This Training Tool
                </h2>
                <button
                  onClick={() => setShowInstructions(!showInstructions)}
                  className="px-3 py-1 bg-white/20 rounded-lg hover:bg-white/30 transition-colors text-sm"
                >
                  {showInstructions ? '▲ Hide' : '▼ Show'}
                </button>
              </div>
              
              {showInstructions && (
                <div className="mt-4 space-y-4">
                  {/* Page Structure */}
                  <div className="bg-white/10 rounded-lg p-4">
                    <h3 className="font-bold mb-2">🗂️ Page Structure</h3>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-2 text-sm">
                      <div>1. <strong>Template</strong> - 5-step troubleshooting framework</div>
                      <div>2. <strong>Quick Identifier</strong> - Fast category hints</div>
                      <div>3. <strong>Scenarios</strong> - 6 practice cases to solve</div>
                    </div>
                  </div>

                  {/* How to Solve */}
                  <div className="bg-white/10 rounded-lg p-4">
                    <h3 className="font-bold mb-2">📝 How to Solve Each Scenario</h3>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-2 text-sm">
                      <div className="flex items-center gap-2">
                        <span className="bg-white/30 rounded-full w-5 h-5 flex items-center justify-center text-xs">1</span>
                        <span>Click a scenario tile</span>
                      </div>
                      <div className="flex items-center gap-2">
                        <span className="bg-white/30 rounded-full w-5 h-5 flex items-center justify-center text-xs">2</span>
                        <span>Read what merchant says</span>
                      </div>
                      <div className="flex items-center gap-2">
                        <span className="bg-white/30 rounded-full w-5 h-5 flex items-center justify-center text-xs">3</span>
                        <span>Think: what would you ask?</span>
                      </div>
                      <div className="flex items-center gap-2">
                        <span className="bg-white/30 rounded-full w-5 h-5 flex items-center justify-center text-xs">4</span>
                        <span>Reveal info step by step</span>
                      </div>
                    </div>
                  </div>

                  {/* Tips */}
                  <div className="flex flex-wrap gap-4 text-sm">
                    <div className="flex items-center gap-1">💡 <strong>Tip:</strong> Form your hypothesis before revealing answers</div>
                    <div className="flex items-center gap-1">🎯 <strong>Goal:</strong> Identify the correct root cause category</div>
                  </div>
                </div>
              )}
            </div>

            {/* Root Cause Analysis Template - Horizontal Tiles */}
            <div className="bg-white rounded-xl shadow-lg p-5 mb-6">
              <h2 className="text-lg font-bold text-gray-800 mb-4">🔧 Root Cause Analysis Template</h2>
              
              {/* Step Tiles */}
              <div className="grid grid-cols-5 gap-2 mb-4">
                {templateSteps.map((step) => (
                  <button
                    key={step.id}
                    onClick={() => setActiveTemplateStep(activeTemplateStep === step.id ? null : step.id)}
                    className={`p-3 rounded-lg text-white text-center transition-all ${
                      activeTemplateStep === step.id ? step.activeColor : step.color
                    }`}
                  >
                    <div className="font-bold text-sm">{step.title}</div>
                    <div className="text-xs opacity-90">{step.subtitle}</div>
                  </button>
                ))}
              </div>

              {/* Expanded Questions */}
              {activeTemplateStep && (
                <div className="bg-gray-50 rounded-lg p-4 border-l-4 border-gray-300 animate-fadeIn">
                  <h4 className="font-semibold text-gray-700 mb-2">
                    Questions to ask during "{templateSteps.find(s => s.id === activeTemplateStep)?.title}":
                  </h4>
                  <ul className="space-y-1">
                    {templateSteps.find(s => s.id === activeTemplateStep)?.questions.map((q, idx) => (
                      <li key={idx} className="text-sm text-gray-600 flex items-start gap-2">
                        <span className="text-gray-400">→</span>
                        {q}
                      </li>
                    ))}
                  </ul>
                </div>
              )}
            </div>

            {/* Quick Category Identifier */}
            <div className="bg-amber-50 rounded-xl shadow-lg p-5 mb-6 border border-amber-200">
              <h3 className="font-bold text-amber-800 mb-3">🎯 Quick Category Identifier</h3>
              <div className="grid grid-cols-2 md:grid-cols-3 gap-2 text-sm">
                <div className="flex items-center gap-2 bg-white/60 p-2 rounded">
                  <span className="w-2 h-2 bg-yellow-500 rounded-full"></span>
                  <span><strong>No lights?</strong> → Power</span>
                </div>
                <div className="flex items-center gap-2 bg-white/60 p-2 rounded">
                  <span className="w-2 h-2 bg-red-500 rounded-full"></span>
                  <span><strong>One reader broken?</strong> → Hardware</span>
                </div>
                <div className="flex items-center gap-2 bg-white/60 p-2 rounded">
                  <span className="w-2 h-2 bg-blue-500 rounded-full"></span>
                  <span><strong>Connection drops?</strong> → Network</span>
                </div>
                <div className="flex items-center gap-2 bg-white/60 p-2 rounded">
                  <span className="w-2 h-2 bg-purple-500 rounded-full"></span>
                  <span><strong>Wrong receipt info?</strong> → Config</span>
                </div>
                <div className="flex items-center gap-2 bg-white/60 p-2 rounded">
                  <span className="w-2 h-2 bg-green-500 rounded-full"></span>
                  <span><strong>All cards declined?</strong> → Software</span>
                </div>
                <div className="flex items-center gap-2 bg-white/60 p-2 rounded">
                  <span className="w-2 h-2 bg-orange-500 rounded-full"></span>
                  <span><strong>Service warning?</strong> → Agreement</span>
                </div>
              </div>
            </div>

            {/* The 5 Whys Technique */}
            <div className="bg-indigo-50 rounded-xl shadow-lg p-5 mb-6 border border-indigo-200">
              <h3 className="font-bold text-indigo-800 mb-2">💡 The 5 Whys Technique</h3>
              <p className="text-sm text-gray-600 mb-2">Keep asking "Why?" to dig deeper to the root cause:</p>
              <div className="flex flex-wrap gap-2 text-xs">
                <span className="bg-indigo-100 px-2 py-1 rounded">Why not working? → Blank screen</span>
                <span className="text-indigo-400">→</span>
                <span className="bg-indigo-100 px-2 py-1 rounded">Why blank? → No power</span>
                <span className="text-indigo-400">→</span>
                <span className="bg-indigo-100 px-2 py-1 rounded">Why no power? → Cable loose</span>
                <span className="text-indigo-400">→</span>
                <span className="bg-indigo-100 px-2 py-1 rounded">Why loose? → Terminal moved</span>
                <span className="text-indigo-400">→</span>
                <span className="bg-indigo-200 px-2 py-1 rounded font-medium">Root Cause!</span>
              </div>
            </div>

            {/* Scenarios Section */}
            <div className="bg-white rounded-xl shadow-lg p-5">
              <h2 className="text-lg font-bold text-gray-800 mb-4">🎓 Practice Scenarios</h2>
              
              {/* Scenario Tiles */}
              <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mb-4">
                {scenarios.map((scenario) => (
                  <button
                    key={scenario.id}
                    onClick={() => handleScenarioClick(scenario)}
                    className={`p-4 rounded-lg text-left transition-all border-2 ${
                      activeScenario?.id === scenario.id 
                        ? 'bg-blue-50 border-blue-500 shadow-md' 
                        : 'bg-gray-50 border-gray-200 hover:border-blue-300 hover:bg-blue-50/50'
                    }`}
                  >
                    <div className="text-xs text-gray-400 mb-1">Scenario {scenario.id}</div>
                    <div className="font-semibold text-gray-800 text-sm leading-tight">{scenario.title}</div>
                  </button>
                ))}
              </div>

              {/* Active Scenario Detail */}
              {activeScenario && (
                <div className="border-t-2 border-gray-100 pt-5 mt-2">
                  <div className="flex justify-between items-start mb-4">
                    <h3 className="text-xl font-bold text-gray-800">
                      Scenario {activeScenario.id}: {activeScenario.title}
                    </h3>
                    <button 
                      onClick={() => setActiveScenario(null)}
                      className="text-gray-400 hover:text-gray-600 text-xl"
                    >
                      ✕
                    </button>
                  </div>

                  {/* What the merchant says */}
                  <div className="bg-blue-50 rounded-lg p-4 mb-4 border-l-4 border-blue-500">
                    <h4 className="font-semibold text-blue-800 mb-2 flex items-center gap-2">
                      📞 What the merchant says:
                    </h4>
                    <p className="text-gray-700 italic text-lg">"{activeScenario.merchantSays}"</p>
                  </div>

                  {/* Prompt */}
                  <div className="bg-gray-100 rounded-lg p-4 mb-4 text-center">
                    <p className="text-gray-700 font-medium">🤔 Which questions would you ask?</p>
                    <p className="text-gray-500 text-sm mt-1">Think about what information you need before revealing more...</p>
                  </div>

                  {/* Progressive Reveal Buttons */}
                  <div className="flex flex-wrap gap-3 mb-4">
                    <button
                      onClick={() => setShowAdditionalInfo(!showAdditionalInfo)}
                      className={`px-4 py-2 rounded-lg font-medium transition-all flex items-center gap-2 ${
                        showAdditionalInfo 
                          ? 'bg-gray-200 text-gray-700' 
                          : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                      }`}
                    >
                      {showAdditionalInfo ? '✓' : '1.'} Additional Information Gathered
                      <span className="text-xs">{showAdditionalInfo ? '▲' : '▼'}</span>
                    </button>

                    <button
                      onClick={() => setShowKeyQuestions(!showKeyQuestions)}
                      className={`px-4 py-2 rounded-lg font-medium transition-all flex items-center gap-2 ${
                        showKeyQuestions 
                          ? 'bg-yellow-200 text-yellow-800' 
                          : 'bg-yellow-100 text-yellow-700 hover:bg-yellow-200'
                      }`}
                    >
                      {showKeyQuestions ? '✓' : '2.'} Key Questions to Consider
                      <span className="text-xs">{showKeyQuestions ? '▲' : '▼'}</span>
                    </button>

                    <button
                      onClick={() => setShowAnswer(!showAnswer)}
                      className={`px-4 py-2 rounded-lg font-medium transition-all flex items-center gap-2 ${
                        showAnswer 
                          ? 'bg-green-500 text-white' 
                          : 'bg-green-100 text-green-700 hover:bg-green-200'
                      }`}
                    >
                      {showAnswer ? '✓' : '3.'} Look at the Answer
                      <span className="text-xs">{showAnswer ? '▲' : '▼'}</span>
                    </button>
                  </div>

                  {/* Additional Info - Expandable */}
                  {showAdditionalInfo && (
                    <div className="bg-gray-50 rounded-lg p-4 mb-4 border-l-4 border-gray-400">
                      <h4 className="font-semibold text-gray-700 mb-2">📋 Additional information gathered:</h4>
                      <ul className="space-y-1">
                        {activeScenario.additionalInfo.map((info, idx) => (
                          <li key={idx} className="text-sm text-gray-600 flex items-start gap-2">
                            <span className="text-gray-400">•</span>
                            {info}
                          </li>
                        ))}
                      </ul>
                    </div>
                  )}

                  {/* Key Questions - Expandable */}
                  {showKeyQuestions && (
                    <div className="bg-yellow-50 rounded-lg p-4 mb-4 border-l-4 border-yellow-400">
                      <h4 className="font-semibold text-yellow-800 mb-2">❓ Key questions you could ask:</h4>
                      <ul className="space-y-1">
                        {activeScenario.keyQuestions.map((q, idx) => (
                          <li key={idx} className="text-sm text-gray-700 flex items-start gap-2">
                            <span className="text-yellow-500 font-bold">{idx + 1}.</span>
                            {q}
                          </li>
                        ))}
                      </ul>
                    </div>
                  )}

                  {/* Answer Section - Expandable */}
                  {showAnswer && (
                    <div className="space-y-3">
                      <div className="bg-red-50 rounded-lg p-4 border-l-4 border-red-500">
                        <h4 className="font-bold text-red-800 mb-1 flex items-center gap-2">
                          🎯 Root Cause:
                          <span className={`text-xs px-2 py-0.5 rounded-full ${categories[activeScenario.category].color}`}>
                            {categories[activeScenario.category].label}
                          </span>
                        </h4>
                        <p className="text-gray-800 font-medium">{activeScenario.rootCause}</p>
                      </div>

                      <div className="bg-blue-50 rounded-lg p-4 border-l-4 border-blue-500">
                        <h4 className="font-bold text-blue-800 mb-1">💡 Explanation:</h4>
                        <p className="text-gray-700 text-sm">{activeScenario.explanation}</p>
                      </div>

                      <div className="bg-green-50 rounded-lg p-4 border-l-4 border-green-500">
                        <h4 className="font-bold text-green-800 mb-1">✅ Resolution:</h4>
                        <p className="text-gray-700 text-sm">{activeScenario.resolution}</p>
                      </div>

                      {/* Next Scenario */}
                      {activeScenario.id < scenarios.length && (
                        <div className="text-center pt-4">
                          <button
                            onClick={() => {
                              handleScenarioClick(scenarios[activeScenario.id]);
                            }}
                            className="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
                          >
                            Next Scenario →
                          </button>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              )}

              {/* Empty State */}
              {!activeScenario && (
                <div className="text-center py-8 text-gray-400">
                  <p className="text-4xl mb-2">👆</p>
                  <p>Click on a scenario tile above to start practicing</p>
                </div>
              )}
            </div>

          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<RootCauseAnalysisTraining />);
  </script>
</body>
</html>
